openapi: 3.0.3
info:
  title: MSA Account WebFlux API
  description: Reactive Microservice for Account Management using Spring WebFlux
  version: 1.0.0
  contact:
    name: API Support
    email: support@rauka.org
servers:
  - url: http://localhost:8080
    description: Development server
paths:
  /api/accounts:
    get:
      summary: Get all accounts
      operationId: getAllAccounts
      tags:
        - accounts
      responses:
        '200':
          description: List of accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountDTO'
        '500':
          description: Internal server error
    post:
      summary: Create a new account
      operationId: createAccount
      tags:
        - accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDTO'
      responses:
        '201':
          description: Account created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDTO'
        '400':
          description: Bad request
        '500':
          description: Internal server error

  /api/accounts/{accountId}:
    get:
      summary: Get account by ID
      operationId: getAccountById
      tags:
        - accounts
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Account found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDTO'
        '404':
          description: Account not found
        '500':
          description: Internal server error
    put:
      summary: Update account
      operationId: updateAccount
      tags:
        - accounts
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDTO'
      responses:
        '200':
          description: Account updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDTO'
        '404':
          description: Account not found
        '400':
          description: Bad request
        '500':
          description: Internal server error
    delete:
      summary: Delete account
      operationId: deleteAccount
      tags:
        - accounts
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Account deleted successfully
        '404':
          description: Account not found
        '500':
          description: Internal server error

  /api/accounts/number/{accountNumber}:
    get:
      summary: Get account by account number
      operationId: getAccountByAccountNumber
      tags:
        - accounts
      parameters:
        - name: accountNumber
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Account found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDTO'
        '404':
          description: Account not found
        '500':
          description: Internal server error

  /api/accounts/type/{accountType}:
    get:
      summary: Get accounts by type
      operationId: getAccountsByType
      tags:
        - accounts
      parameters:
        - name: accountType
          in: path
          required: true
          schema:
            type: string
            enum: [AHORRO, CORRIENTE]
      responses:
        '200':
          description: List of accounts by type
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountDTO'
        '400':
          description: Invalid account type
        '500':
          description: Internal server error

components:
  schemas:
    AccountDTO:
      type: object
      properties:
        accountId:
          type: integer
          format: int64b
          description: Unique identifier for the account
        accountNumber:
          type: string
          description: Account number
          example: "ACC-2024-001"
        identification:
          type: string
          description: Identifdication of the account owner
          example: "0123456789"
        accountType:
          type: string
          enum: [AHORRO, CORRIENTE]
          description: Type of account
        balance:
          type: number
          format: decimal
          description: Current account balance
          example: 1500.50
        createdAt:
          type: string
          format: date-time
          description: Account creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
      required:
        - accountNumber
        - accountType
        - balance
