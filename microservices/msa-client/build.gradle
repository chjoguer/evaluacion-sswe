plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.5'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.openapi.generator' version '7.15.0'
}

group = 'org.rauka.dm'
version = '0.0.1-SNAPSHOT'
description = 'msa-client'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
def packageName = 'org.rauka.dm.msaclient'
import org.openapitools.generator.gradle.plugin.tasks.GenerateTask
tasks.register('buildSpringServer',GenerateTask){
    generatorName.set("spring")
    inputSpec.set("$rootDir/src/main/resources/openapi.yaml")
    outputDir.set("$buildDir/generated")
    apiPackage.set("${packageName}.controller")
    modelPackage.set("${packageName}.service.models")
    library.set("spring-boot")
    configOptions.set([
            useSpringBoot3: "true",
            useJakartaEe: "true",
            serializableModel: "true",
            dateLibrary: "java8",
            openApiNullable: "false",
            apiFirst: "false",
            delegatePattern: "true",
            sourceFolder: "src/main/java",
            interfaceOnly: "true",
            configPackage: "${packageName}.config",
            basePackage: "${packageName}",
            disallowAdditionalPropertiesIfNotPresent: "true",
            useTags: "true",
    ])
}

sourceSets {
    main {
        java {
            srcDirs += ["$buildDir/generated/src/main/java"]
        }
    }
}
tasks.named('compileJava') {
    dependsOn tasks.named('buildSpringServer')
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'
    implementation 'org.postgresql:postgresql:42.7.3'
    implementation 'org.mapstruct:mapstruct:1.5.5.Final'

    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
