server:
  port: 8084

spring:
  application:
    name: msa-pdf-generator
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/msa_movement_db
    username: example_user
    password: example_pass
    pool:
      initial-size: 10
      max-size: 20
      max-idle-time: 30s
      validation-query: SELECT 1 FROM movements LIMIT 1

# Configuración para las APIs externas
cliente:
  api:
    base-url: http://localhost:8081

account:
  api:
    base-url: http://localhost:8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.rauka.dm.msapdfgenerator: DEBUG
    reactor: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
