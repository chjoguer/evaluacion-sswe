plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'ocore - Orchestrator Core Service'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

configurations {
    compileOnly { extendsFrom annotationProcessor }
}

repositories {
    mavenCentral()
    // Quita milestones/snapshots salvo que uses versiones M/RC
    // maven { url 'https://repo.spring.io/milestone' }
    // maven { url 'https://repo.spring.io/snapshot' }
}

ext {
    set('springCloudVersion', '2025.0.0') // Compatible con Boot 3.5.x
}

dependencies {
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // (Opcional) WebClient ya viene en el starter webflux; no necesitas el core explícito
    // implementation 'org.springframework:spring-webflux'

    // Netty HTTP (transitiva de webflux; déjalo solo si necesitas fijar versión/optimizar)
    // implementation 'io.projectreactor.netty:reactor-netty-http'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Jackson (el starter ya trae Jackson; agrega módulos extra si los usas)
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // Circuit Breaker (Spring Cloud CircuitBreaker con Resilience4j)
    implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-reactor-resilience4j'

    // Micrometer
    implementation 'io.micrometer:micrometer-core'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
    // (Opcional) Estos ya vienen transitivamente en el starter-test
    // testImplementation 'org.junit.jupiter:junit-jupiter'
    // testImplementation 'org.mockito:mockito-core'
    // testImplementation 'org.mockito:mockito-junit-jupiter'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

tasks.named('test') { useJUnitPlatform() }

jar { enabled = false }
