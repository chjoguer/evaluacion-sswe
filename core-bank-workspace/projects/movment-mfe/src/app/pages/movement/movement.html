  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold">
      <i class="fas fa-exchange-alt me-2 text-primary"></i>
      Gestión de Movimientos
    </h2>
  </div>

  <!-- Componente Integrado: Search + Table -->
  <app-ui-search-table
    [data]="movements()"
    [config]="searchTableConfig"
    [loading]="loading()"
    (deleteRow)="deleteRow($event)"
    (editRow)="openModal($event)"
    (createNew)="openCreateModal()"
    (searchResults)="onSearchResults($event)">
  </app-ui-search-table>

  <!-- Modal de Creación -->
  <app-ui-modal 
    [title]="'Crear Nuevo Movimiento'" 
    [isOpen]="isCreateModalOpen" 
    [fields]="createFields"
    [submitButtonText]="'Crear Movimiento'"
    [submitButtonClass]="'btn btn-success'"
    [loading]="loading()"
    (closeModal)="closeCreateModal()"
    (submitForm)="onCreateMovement($event)">
  </app-ui-modal>

  <!-- Modal de Actualización -->
  <app-ui-modal 
    [title]="'Actualizar Movimiento'" 
    [isOpen]="isModalOpen" 
    [fields]="customFields"
    [data]="selectedRow"
    [submitButtonText]="'Actualizar Movimiento'"
    [submitButtonClass]="'btn btn-primary'"
    [loading]="loading()"
    (closeModal)="closeModal()"
    (openModal)="openModal($event)"
    (submitForm)="onModalSubmit($event)">
  </app-ui-modal>

  <!-- Modal de Eliminación -->
  <app-ui-modal 
    [title]="'Confirmar Eliminación'" 
    [isOpen]="isModalOpenAlert"
    [data]="selectedRow"
    [showForm]="false"
    [submitButtonText]="'Eliminar'"
    [submitButtonClass]="'btn btn-danger'"
    [cancelButtonText]="'Cancelar'"
    [loading]="loading()"
    (closeModal)="closeModalAlert()"
    (submitForm)="onModalSubmitAlert($event)">
    <div class="text-center py-3">
      <i class="fas fa-exclamation-triangle text-warning fa-3x mb-3"></i>
      <h5>¿Está seguro que desea eliminar este movimiento?</h5>
      <p class="text-muted mb-0">
        <strong>{{ selectedRow?.description }}</strong><br>
        <small>Referencia: {{ selectedRow?.reference }}</small><br>
      </p>
      <p class="text-danger mt-2 mb-0">
        <small>Esta acción no se puede deshacer.</small>
      </p>
    </div>
  </app-ui-modal>
